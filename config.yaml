# skill-sync manifest — аннотированный справочник со всеми поддерживаемыми формами.
#
# Запуск:
#   python3 skill_sync.py --project /path/to/project --apply
#
# По умолчанию скрипт ищет этот файл как `config.yaml` в каталоге --project.
# Другой путь — через --config. Скопируйте этот шаблон в проект и оставьте
# только нужные строки.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО НАСТРАИВАЕТСЯ ФАЙЛОМ: только ключ `skills` (см. ниже).
#
# ЧТО НАСТРАИВАЕТСЯ ФЛАГАМИ / ОКРУЖЕНИЕМ (в файл не выносится):
#   --project <path>     целевой проект, куда кладутся симлинки; по умолчанию CWD
#   --config <path>      путь к этому файлу; по умолчанию <project>/config.yaml
#   --apply              реально скачать источники и создать симлинки
#                        (без него — сухой прогон, только печать плана)
#   --update             обновить уже скачанные источники: git pull --ff-only,
#                        при неудаче — повторное клонирование; подхватывает
#                        skills, добавленные в источник после прошлого запуска
#   --prune              удалить из <project>/.agents/skills те управляемые
#                        симлинки, которых больше нет в манифесте
#   --cache-dir <path>   каталог общего кэша скачанных источников
#   SKILL_SYNC_CACHE     то же, что --cache-dir, но через переменную окружения
#                        Приоритет: --cache-dir > $SKILL_SYNC_CACHE >
#                        <каталог skill_sync.py>/.skill-sources
# ─────────────────────────────────────────────────────────────────────────────

skills:
  # Три секции: common, codex, claude. Их содержимое объединяется в один общий
  # пул — деление носит организационный смысл, фильтрации по агенту в этой
  # версии нет. Любая секция может быть пустой ([]) или отсутствовать.

  common:
    # ── Строковые селекторы ────────────────────────────────────────────────

    # Все skills репозитория (рекурсивно ищутся папки со SKILL.md; если есть
    # подкаталог skills/, сканируется он, иначе — корень репозитория):
    - github.com:addyosmani/agent-skills:all

    # Один конкретный skill из репозитория:
    - github.com:anthropics/skills:pdf

    # Ещё один репозиторий целиком:
    - github.com:obra/superpowers:all

    # Личный skill из custom-skills/<name>/ рядом со скриптом.
    # (Закомментировано: требует реальной папки custom-skills/my-internal-skill/,
    #  иначе запуск падает с ошибкой.)
    # - personal:my-internal-skill

    # Установка через npx: `npx <package> install --skills <skill>`.
    # Имя skill обязательно — `all` с npx не поддерживается:
    - npx/ecc-universal:ecc-guide

  codex:
    # ── Развёрнутая (dict) форма ───────────────────────────────────────────
    # Удобна, когда из одного источника нужно несколько skills.

    # Ключ можно писать как `github.com` или короче `github` (только в dict-форме):
    - github:
        # либо строкой "owner/repo:skill"
        - vercel-labs/skills:find-skills
        # либо "owner/repo" -> список skills
        - anthropics/skills:
            - pdf
            - docx
            - pptx

    # - personal:
    #     - skill-a
    #     - skill-b

    - npx:
        - ecc-universal:ecc-guide

  # Пустая секция — допустимо:
  claude: []
