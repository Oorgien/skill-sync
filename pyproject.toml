[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-sync"
version = "0.1.0"
description = "Sync and manage agent skills from YAML manifests into local project directories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Daniel Kniazev"},
]
keywords = ["ai-agent", "claude", "codex", "skills", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skill-sync = "skill_sync:cli"

[project.urls]
Homepage = "https://github.com/Oorgien/skill-sync"
Repository = "https://github.com/Oorgien/skill-sync"

[tool.hatch.build.targets.wheel]
only-include = ["skill_sync.py"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
